<!doctype html>
<html>
<head>
<title>Registration Form</title>
</head> <body
bgcolor="#E4F0F8">
<center>
<font color="blue" size="6" face="Arial"> Registration Form </font>
</center>
<br />
<form action="right.html" target="rightframe">
First Name (Minimum 6 characters)
<font color="red">*</font>
<input type="text" id="firstname" name="firstname" />
<br /><br />
Last Name
<font color="red">*</font>
<input type="text" id="lastname" name="lastname" />
<br /><br />
Email Address
<font color="red">*</font>
<input type="text" id="email" name="email" />
<br />
<font color="red"> (one e-mail id only): </font>
<font color="blue"> e.g. smith@hotmail.com </font>
<br /><br />
Password (Minimum 6 characters)
<font color="red">*</font>
<input type="password" id="pass" name="password" />
<br /><br />
Address
<font color="red">*</font>
<textarea id="addr" name="address" rows="2" cols="20"></textarea>
<br /><br />
Mobile No
<font color="red">*</font>
<input type="text" id="mobileno" name="mobileno" />
<br /><br />
Gender:
<input type="radio" name="gender" value="male" /> Male 
<input type="radio" name="gender" value="female" /> Female
<br /><br />
<input type="submit" value="Submit" />
<input type="reset" value="Reset" />
</form>
</body>
</html>
